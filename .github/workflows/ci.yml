name: CI

# CA-01 : déclenché à chaque push (toute branche) et sur chaque PR vers main
on:
  push:
  pull_request:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

jobs:
  build-test:
    name: Build, tests & couverture
    runs-on: ubuntu-latest

    # Le contexte Spring (contextLoads, tests d'intégration JPA) a besoin d'une
    # vraie base pour que Hibernate détermine son dialecte. En local, Docker
    # Compose fournit postgres-platform ; en CI, ce service le remplace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Mêmes identifiants que .env.dev, mais URL vers "localhost" car le
      # service ci-dessus est exposé sur le runner, pas sur le réseau Docker.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/platform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: platform

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      # On lance les tests séparément et on capture le résultat (continue-on-error)
      # pour pouvoir quand même générer et publier le rapport JaCoCo même si des
      # tests échouent (CA-01), puis faire échouer explicitement le job ensuite (CA-02).
      - name: Compiler et lancer les tests (JUnit)
        id: tests
        run: ./mvnw --batch-mode --no-transfer-progress test
        continue-on-error: true

      - name: Générer le rapport de couverture JaCoCo
        if: always()
        run: ./mvnw --batch-mode --no-transfer-progress jacoco:report

      - name: Publier le rapport JaCoCo en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Publier les rapports de tests (Surefire) en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      # CA-02 : si un test a échoué à l'étape précédente, le job échoue ici,
      # ce qui fait apparaître le statut "failure" sur le commit / la PR.
      - name: Échouer le job si des tests ont échoué
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Des tests unitaires ont échoué, voir le rapport Surefire en artefact."
          exit 1