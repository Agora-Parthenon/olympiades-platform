spring.application.name=platform
server.port=8080
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=kafka:9092
spring.datasource.url=jdbc:postgresql://postgres-platform:5432/platform
spring.datasource.username=platform
spring.datasource.password=platform
spring.flyway.schemas=platform
spring.flyway.default-schema=platform
# Do not let an unreachable Kafka hold a player's request for a minute
spring.kafka.producer.properties.max.block.ms=3000
